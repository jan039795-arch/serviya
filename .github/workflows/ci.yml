# Integración continua (tasks.md T042): API (.NET 10 + Testcontainers) y web (Angular).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Docker viene instalado en ubuntu-latest: Testcontainers levanta PostgreSQL con PostGIS.
      - run: dotnet test --no-build --configuration Release --coverage --coverage-output-format cobertura
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-api
          path: api/TestResults/*.cobertura.xml
          if-no-files-found: ignore

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx ng test --no-watch
      - run: npx ng build
